[project]
name = "codex-status-widget"
version = "0.3.7"
description = "Codex status and quota widget for the ChatGPT desktop app on Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[dependency-groups]
dev = [
  "nuitka>=4.1.3",
  "pytest>=8.0",
  "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
