[project]
name = "codex-status-widget"
version = "0.5.3"
description = "Codex status and quota widget for the ChatGPT desktop app on Windows"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "gem12-screen>=0.1.0",
  "pillow>=11.0",
]

[dependency-groups]
dev = [
  "nuitka>=4.1.3",
  "pytest>=8.0",
  "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
gem12-screen = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
